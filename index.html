<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- PWA App Tags -->
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TennisLeague">
  <title>Tennis League Dashboard</title>

  <!-- React & Babel Scripts -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  
  <!-- EmailJS Script -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <!-- Original Clean Tennis Green Theme Styles -->
  <style>
    :root {
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --primary-green: #2e7d32;
      --accent-green: #4caf50;
      --text-main: #333333;
      --text-muted: #666666;
      --border-color: #e0e0e0;
      --radius: 10px;
      --shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    #root {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    .header-container {
      text-align: center;
      margin-bottom: 25px;
      padding: 10px;
    }

    h1 {
      color: var(--primary-green);
      margin: 0 0 5px 0;
      font-size: 1.8rem;
    }

    .subtitle {
      color: var(--text-muted);
      margin: 0;
      font-size: 1rem;
    }

    .app-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      margin-bottom: 25px;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--primary-green);
      margin-top: 0;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .meta-info {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 15px;
    }

    .player-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .player-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      background: #f9f9f9;
      border-radius: 6px;
      border: 1px solid #eee;
    }

    .player-row.highlight-user {
      border-left: 4px solid var(--primary-green);
      background: #edf7ed;
    }

    .avatar-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--primary-green);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.9rem;
    }

    /* Sub Request Interactive Element */
    .sub-panel {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 8px;
      border: 1px dashed #ccc;
    }

    .sub-checkbox-label {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.9rem;
      cursor: pointer;
      color: var(--text-main);
      line-height: 1.4;
    }

    .sub-checkbox-label input {
      margin-top: 3px;
      transform: scale(1.1);
    }

    /* Scoreboard Tracking Form Styles */
    .score-form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    label {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--text-muted);
    }

    select, input[type="number"] {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      font-size: 0.95rem;
      background: white;
    }

    /* Core Table Styles */
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      border-bottom: 2px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      padding: 10px;
    }

    td {
      border-bottom: 1px solid #f0f0f0;
      padding: 12px 10px;
      font-size: 0.95rem;
    }

    .rank-number {
      font-weight: bold;
      color: var(--primary-green);
      margin-right: 6px;
    }

    /* Button Variations */
    .action-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 12px;
    }

    .btn-green {
      background-color: var(--primary-green);
      color: white;
    }

    .btn-green:hover {
      background-color: #1b5e20;
    }

    .action-btn:disabled {
      background-color: #cccccc;
      color: #777777;
      cursor: not-allowed;
    }

    .status-toast {
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-weight: bold;
      font-size: 0.9rem;
    }
    .toast-success { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
    .toast-error { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- BASE DATA SET (Used if LocalStorage is empty) ---
    const DEFAULT_PLAYERS = [
      { id: 1, name: "James Anderson", email: "james@example.com", wins: 5, losses: 2, points: 15 },
      { id: 2, name: "Sarah Jenkins", email: "sarah@example.com", wins: 4, losses: 3, points: 12 },
      { id: 3, name: "Mike Chen", email: "mike@example.com", wins: 3, losses: 4, points: 9 },
      { id: 4, name: "David Kim", email: "david@example.com", wins: 2, losses: 5, points: 6 },
      { id: 5, name: "Emma Wilson", email: "emma@example.com", wins: 6, losses: 1, points: 18 }
    ];

    const INITIAL_SCHEDULE = {
      weekLabel: "Week 2 of 8",
      courts: [
        { id: "c1", num: 1, time: "7:00 PM", players: [1, 2, 3, 4] }
      ]
    };

    const CURRENT_LOGGED_IN_USER_ID = 1; // Defaulting to James for dashboard perspective

    // --- UTILITY COMPONENT FOR AVATARS ---
    const PlayerAvatar = ({ name }) => {
      const initial = name ? name.charAt(0) : "?";
      return <div className="avatar-icon">{initial}</div>;
    };

    // --- MAIN APPLICATION INTERFACE ---
    function TennisLeagueApp() {
      // Load current standings state from local storage so inputs persist
      const [players, setPlayers] = useState(() => {
        const savedData = localStorage.getItem("tennis_league_standings");
        return savedData ? JSON.parse(savedData) : DEFAULT_PLAYERS;
      });

      // Interactive Scoreboard tracking states
      const [winnerId, setWinnerId] = useState("");
      const [loserId, setLoserId] = useState("");
      const [pointsEarned, setPointsEarned] = useState(3);

      // Interactive Sub Request email system states
      const [subChecked, setSubChecked] = useState(false);
      const [isSendingEmail, setIsSendingEmail] = useState(false);
      const [emailFeedback, setEmailFeedback] = useState({ type: null, text: "" });

      // Save to local storage automatically when standings change
      useEffect(() => {
        localStorage.setItem("tennis_league_standings", JSON.stringify(players));
      }, [players]);

      // Initialize EmailJS safely
      useEffect(() => {
        emailjs.init("YOUR_PUBLIC_KEY_HERE"); // <-- Insert your EmailJS Public Key here
      }, []);

      // Calculate context details based on current user
      const currentUserObj = players.find(p => p.id === CURRENT_LOGGED_IN_USER_ID) || players[0];
      const activeMatchCard = INITIAL_SCHEDULE.courts.find(c => c.players.includes(currentUserObj.id));
      const sortedStandingsList = [...players].sort((a, b) => b.points - a.points);

      // --- HANDLER: SCORE TRACKING UPDATE ---
      const handleLogMatchScore = (e) => {
        e.preventDefault();
        if (!winnerId || !loserId) {
          alert("Please select both a winning player and a losing player.");
          return;
        }
        if (winnerId === loserId) {
          alert("A player cannot play against themselves. Please fix selections.");
          return;
        }

        const updatedPlayersList = players.map(player => {
          if (player.id === parseInt(winnerId)) {
            return {
              ...player,
              wins: player.wins + 1,
              points: player.points + parseInt(pointsEarned)
            };
          }
          if (player.id === parseInt(loserId)) {
            return {
              ...player,
              losses: player.losses + 1
            };
          }
          return player;
        });

        setPlayers(updatedPlayersList);
        // Reset interactive entry options
        setWinnerId("");
        setLoserId("");
        alert("Match scores successfully recorded and standings updated!");
      };

      // --- HANDLER: EMAIL SUB REQUEST ---
      const handleProcessSubRequest = async () => {
        if (!activeMatchCard) return;
        setIsSendingEmail(true);
        setEmailFeedback({ type: null, text: "" });

        // Identify players occupied during the exact same slot
        const blockedUserIds = new Set();
        INITIAL_SCHEDULE.courts.forEach(court => {
          if (court.time === activeMatchCard.time) {
            court.players.forEach(pid => blockedUserIds.add(pid));
          }
        });

        // Filter master pool down to available records
        const eligibleSubs = players.filter(p => !blockedUserIds.has(p.id) && p.id !== currentUserObj.id);
        const compiledEmailString = eligibleSubs.map(p => p.email).join(",");

        if (!compiledEmailString) {
          alert("No open league players were found available for this time slot.");
          setIsSendingEmail(false);
          return;
        }

        try {
          await emailjs.send(
            "YOUR_SERVICE_ID_HERE",  // <-- Insert your EmailJS Service ID
            "YOUR_TEMPLATE_ID_HERE", // <-- Insert your EmailJS Template ID
            {
              player_name: currentUserObj.name,
              court_num: activeMatchCard.num,
              match_time: activeMatchCard.time,
              sub_emails: compiledEmailString,
              reply_to: currentUserObj.email
            }
          );
          
          setEmailFeedback({ type: "success", text: "✓ Substitute broadcast email successfully sent to available players!" });
          setSubChecked(false);
        } catch (err) {
          console.error("EmailJS dispatch failed:", err);
          setEmailFeedback({ type: "error", text: "✗ Error sending request. Verify your EmailJS configuration variables." });
        } finally {
          setIsSendingEmail(false);
        }
      };

      return (
        <div>
          <div className="header-container">
            <h1>🏆 Glenview Tennis League</h1>
            <p className="subtitle">Official Players Dashboard</p>
          </div>

          {/* FEATURE 1: SCHEDULE AND SUBSTITUTE REQUEST SYSTEM */}
          {activeMatchCard ? (
            <div className="app-card">
              <div className="card-title">
                <span>Your Scheduled Match</span>
                <span style={{fontSize: '0.9rem', color: 'var(--text-muted)'}}>{INITIAL_SCHEDULE.weekLabel}</span>
              </div>
              <div className="meta-info">
                <strong>📍 Court Allocation:</strong> Court {activeMatchCard.num} <br />
                <strong>🕒 Time Window:</strong> {activeMatchCard.time}
              </div>

              <div className="player-list">
                {activeMatchCard.players.map(pid => {
                  const matchPlayer = players.find(p => p.id === pid);
                  if (!matchPlayer) return null;
                  const isSelf = matchPlayer.id === currentUserObj.id;
                  return (
                    <div key={pid} className={`player-row ${isSelf ? 'highlight-user' : ''}`}>
                      <PlayerAvatar name={matchPlayer.name} />
                      <div>
                        <strong>{matchPlayer.name}</strong> {isSelf && " (You)"}
                      </div>
                    </div>
                  );
                })}
              </div>

              <div className="sub-panel">
                {emailFeedback.text && (
                  <div className={`status-toast ${emailFeedback.type === 'success' ? 'toast-success' : 'toast-error'}`}>
                    {emailFeedback.text}
                  </div>
                )}
                
                <label className="sub-checkbox-label">
                  <input 
                    type="checkbox" 
                    checked={subChecked} 
                    onChange={(e) => setSubChecked(e.target.checked)} 
                  />
                  I need a substitute player for this match. Send out an automatic notification broadcast to all qualified off-duty league players.
                </label>

                {subChecked && (
                  <button 
                    className="action-btn btn-green" 
                    onClick={handleProcessSubRequest}
                    disabled={isSendingEmail}
                  >
                    {isSendingEmail ? "Processing Broadcast..." : "Confirm & Dispatch Email Notification"}
                  </button>
                )}
              </div>
            </div>
          ) : (
            <div className="app-card">
              <div className="card-title">Match Schedule</div>
              <p>You have an official bye week. No matches listed.</p>
            </div>
          )}

          {/* FEATURE 2: INTERACTIVE MATCH SCOREBOARD RECORDER */}
          <div className="app-card">
            <div className="card-title">📊 Record Match Results</div>
            <form onSubmit={handleLogMatchScore}>
              <div className="score-form-grid">
                <div className="form-group">
                  <label>Winning Player</label>
                  <select value={winnerId} onChange={e => setWinnerId(e.target.value)}>
                    <option value="">Select winner...</option>
                    {players.map(p => (
                      <option key={p.id} value={p.id}>{p.name}</option>
                    ))}
                  </select>
                </div>
                <div className="form-group">
                  <label>Losing Player</label>
                  <select value={loserId} onChange={e => setLoserId(e.target.value)}>
                    <option value="">Select loser...</option>
                    {players.map(p => (
                      <option key={p.id} value={p.id}>{p.name}</option>
                    ))}
                  </select>
                </div>
              </div>

              <div className="form-group">
                <label>League Points Earned (Winner)</label>
                <input 
                  type="number" 
                  min="1" 
                  max="5" 
                  value={pointsEarned} 
                  onChange={e => setPointsEarned(e.target.value)} 
                />
              </div>

              <button type="submit" className="action-btn btn-green">
                Log Results to Scoreboard
              </button>
            </form>
          </div>

          {/* FEATURE 3: LIVE LEAGUE STANDINGS TABLE */}
          <div className="app-card" style={{overflowX: 'auto'}}>
            <div className="card-title">📈 Current League Standings</div>
            <table>
              <thead>
                <tr>
                  <th>Player Rank</th>
                  <th style={{textAlign: 'center'}}>Wins</th>
                  <th style={{textAlign: 'center'}}>Losses</th>
                  <th style={{textAlign: 'center'}}>Points</th>
                </tr>
              </thead>
              <tbody>
                {sortedStandingsList.map((player, index) => (
                  <tr key={player.id}>
                    <td>
                      <span className="rank-number">#{index + 1}</span>
                      {player.name} {player.id === currentUserObj.id && " (You)"}
                    </td>
                    <td style={{textAlign: 'center'}}>{player.wins}</td>
                    <td style={{textAlign: 'center'}}>{player.losses}</td>
                    <td style={{textAlign: 'center', fontWeight: 'bold', color: 'var(--primary-green)'}}>
                      {player.points}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<TennisLeagueApp />);
  </script>
</body>
</html>
