<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glenview Tennis League</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <!-- React, ReactDOM, Babel Core -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  
  <!-- EmailJS Integration -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --forest: #0d2b1c; --pine: #1b4332; --fern: #2d6a4f; --sage: #52b788;
      --mint: #b7e4c7; --dew: #d8f3dc; --ivory: #faf8f3; --cream: #f0ece4;
      --gold: #b8892a; --gold-m: #d4a843; --gold-l: #f5e6c0; --gold-xl: #fdf8ed;
      --white: #ffffff; --ink: #1a1a1a; --slate: #4a5568; --mist: #9ca3af; --fog: #e5e7eb;
      --red: #c0392b; --red-l: #fde8e8; --blue: #1a56a0; --blue-l: #dbeafe;
      --r: 12px; --r-sm: 8px; --r-lg: 16px;
      --shadow: 0 1px 4px rgba(0,0,0,.07), 0 4px 16px rgba(0,0,0,.05);
      --shadow-sm: 0 1px 3px rgba(0,0,0,.08);
    }
    body { font-family: 'Outfit', sans-serif; background: var(--ivory); color: var(--ink); min-height: 100vh; font-size: 15px; line-height: 1.6; }
    h1, h2, h3 { font-family: 'Playfair Display', serif; }
    button { font-family: 'Outfit', sans-serif; cursor: pointer; border: none; outline: none; }
    input, select { font-family: 'Outfit', sans-serif; outline: none; }
    
    .nav { background: var(--forest); height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,.25); }
    .nav-logo { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .nav-logo-icon { width: 36px; height: 36px; background: var(--gold-m); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .nav-logo-text { color: #fff; font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 600; }
    .nav-links { display: flex; align-items: center; gap: 4px; }
    .nav-link { color: rgba(255,255,255,.65); padding: 7px 13px; border-radius: var(--r-sm); font-size: 14px; font-weight: 500; cursor: pointer; transition: all .18s; background: none; border: none; }
    .nav-link:hover { color: #fff; background: rgba(255,255,255,.1); }
    .nav-link.active { color: #fff; background: rgba(255,255,255,.15); }
    
    .admin-chip { background: var(--gold-m); color: var(--forest); font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; letter-spacing: .04em; }
    .admin-bar { background: var(--gold-xl); border-bottom: 2px solid var(--gold-l); padding: 8px 1.5rem; font-size: 13px; font-weight: 500; color: #7a5b10; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    
    .page { max-width: 1120px; margin: 0 auto; padding: 2.5rem 1.5rem; }
    .page-title { font-size: 1.8rem; font-weight: 700; color: var(--forest); }
    .page-subtitle { color: var(--slate); font-size: .93rem; margin-top: .3rem; margin-bottom: 1.5rem; }
    
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    .three-col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; }
    @media(max-width: 860px) { .two-col, .three-col { grid-template-columns: 1fr; } }
    
    .card { background: var(--white); border-radius: var(--r); box-shadow: var(--shadow); border: 1px solid var(--fog); overflow: hidden; margin-bottom: 1.5rem; }
    .card-header { padding: .85rem 1.2rem; border-bottom: 1px solid var(--fog); display: flex; align-items: center; justify-content: space-between; background: var(--cream); }
    .card-title { font-size: .95rem; font-weight: 600; color: var(--forest); }
    .card-body { padding: 1.2rem; }
    
    .your-court-hero { background: linear-gradient(135deg, var(--forest), var(--pine) 60%, var(--fern)); border-radius: var(--r-lg); padding: 1.5rem; margin-bottom: 2rem; color: #fff; position: relative; overflow: hidden; box-shadow: var(--shadow); }
    .your-court-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; opacity: .7; margin-bottom: .4rem; }
    .your-court-title { font-size: 1.4rem; font-weight: 700; font-family: 'Playfair Display', serif; margin-bottom: .3rem; }
    .your-court-time { font-size: .88rem; opacity: .75; margin-bottom: 1rem; }
    
    .court-card { background: var(--white); border-radius: var(--r); box-shadow: var(--shadow); border: 1px solid var(--fog); overflow: hidden; margin-bottom: 1.5rem; }
    .court-header { background: var(--forest); color: #fff; padding: .7rem 1.1rem; display: flex; align-items: center; justify-content: space-between; }
    .court-name { font-weight: 600; font-size: .9rem; }
    .court-time { font-size: 12px; opacity: .7; }
    
    .rr-matrix-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--slate); margin: 8px 0 4px; }
    .court-field { background: linear-gradient(160deg, #1a5c34, #1e6b3c); border-radius: var(--r-sm); padding: .6rem; position: relative; min-height: 80px; margin-bottom: 8px; }
    .court-net { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,0.3); transform: translateX(-50%); }
    .court-team { width: calc(50% - 10px); display: flex; flex-direction: column; gap: 4px; }
    .court-team.left { float: left; }
    .court-team.right { float: right; }
    .court-p { background: rgba(255,255,255,.15); border-radius: 4px; padding: 3px 6px; display: flex; align-items: center; gap: 5px; }
    .court-p.me { background: rgba(212,168,67,.4); border: 1px solid rgba(212,168,67,.6); }
    .court-p-av" { width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: #fff; flex-shrink: 0; }
    .court-p-av { width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: #fff; flex-shrink: 0; }
    .court-p-name { font-size: 11px; color: #fff; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .clearfix::after { content: ''; display: block; clear: both; }
    
    .avatar { border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; flex-shrink: 0; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px; border-radius: var(--r-sm); font-size: 14px; font-weight: 500; cursor: pointer; transition: all .18s; border: none; white-space: nowrap; }
    .btn-primary { background: var(--forest); color: #fff; } .btn-primary:hover { background: var(--pine); }
    .btn-outline { background: var(--white); color: var(--ink); border: 1px solid var(--fog); } .btn-outline:hover { background: var(--cream); }
    .btn-gold { background: var(--gold-m); color: #fff; } .btn-gold:hover { background: var(--gold); }
    .btn-block { width: 100%; justify-content: center; }
    .btn-google { background: #fff; color: #3c4043; border: 1px solid #ddd; display: flex; align-items: center; gap: 10px; width: 100%; justify-content: center; padding: 12px 20px; font-size: 15px; font-weight: 500; border-radius: var(--r-sm); box-shadow: var(--shadow-sm); transition: all .18s; }
    
    .form-group { margin-bottom: 1rem; }
    .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--slate); margin-bottom: 5px; }
    .form-input { width: 100%; padding: 9px 12px; border: 1px solid var(--fog); border-radius: var(--r-sm); font-size: 14px; background: var(--white); color: var(--ink); }
    .form-select { width: 100%; padding: 9px 12px; border: 1px solid var(--fog); border-radius: var(--r-sm); font-size: 14px; background: var(--white); color: var(--ink); }
    
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 300; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .modal { background: var(--white); border-radius: var(--r-lg); padding: 1.75rem; width: 100%; max-width: 480px; box-shadow: 0 20px 60px rgba(0,0,0,.2); max-height: 90vh; overflow-y: auto; }
    
    .win-bar-wrap { width: 70px; height: 5px; background: var(--fog); border-radius: 3px; overflow: hidden; }
    .win-bar { height: 100%; border-radius: 3px; background: var(--fern); }
    .alert { padding: 11px 15px; border-radius: var(--r-sm); font-size: 14px; display: flex; align-items: flex-start; gap: 10px; margin-bottom: 1rem; }
    .alert-gold { background: var(--gold-xl); color: #7a5b10; border: 1px solid var(--gold-l); }
    
    .players-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
    .player-card { background: var(--white); border-radius: var(--r); box-shadow: var(--shadow-sm); border: 1px solid var(--fog); padding: 1rem; display: flex; align-items: center; gap: 12px; }
    .player-card-info { flex: 1; min-width: 0; }
    .player-card-name { font-weight: 600; font-size: .88rem; }
    .player-card-meta { font-size: 12px; color: var(--mist); margin-top: 1px; }
    
    .admin-toolbar { background: var(--forest); border-radius: var(--r); padding: 1rem 1.25rem; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .admin-toolbar-label { color: rgba(255,255,255,.7); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
    .admin-toolbar-sep { width: 1px; height: 20px; background: rgba(255,255,255,.2); }
    
    .rank-pip { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
    .rank-pip-gold { background: var(--gold-l); color: var(--gold); }
    .rank-pip-gray { background: var(--fog); color: var(--slate); }
    
    .login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--forest), #1a5c34 60%, var(--fern)); padding: 1rem; }
    .login-card { background: var(--white); border-radius: var(--r-lg); padding: 2.5rem; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,.25); text-align: center; }
    .login-logo { width: 60px; height: 60px; background: var(--forest); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 1rem; }
    .google-picker { background: var(--white); border-radius: var(--r-lg); width: 100%; max-width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
    .google-picker-header { background: var(--blue); color: #fff; padding: 1rem 1.25rem; border-radius: var(--r-lg) var(--r-lg) 0 0; font-size: .9rem; font-weight: 500; }
    .google-picker-body { padding: .5rem; max-height: 400px; overflow-y: auto; }
    .google-user-opt { display: flex; align-items: center; gap: 12px; padding: .75rem 1rem; border-radius: var(--r-sm); cursor: pointer; }
    .google-user-opt:hover { background: var(--cream); }
    
    .preset-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .preset-table th { text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 7px 10px; background: var(--cream); border-bottom: 1px solid var(--fog); }
    .preset-table td { padding: 7px 10px; border-bottom: 1px solid var(--fog); }
    
    table.standings-table { width: 100%; border-collapse: collapse; text-align: left; }
    table.standings-table th { border-bottom: 2px solid var(--fog); color: var(--slate); font-size: 0.85rem; text-transform: uppercase; padding: 10px; }
    table.standings-table td { border-bottom: 1px solid var(--fog); padding: 12px 10px; font-size: 0.95rem; }
    
    .sub-section-box { margin-top: 1rem; padding: 1rem; background: rgba(255,255,255,0.12); border-radius: var(--r-sm); border: 1px dashed rgba(255,255,255,0.3); }
    .sub-checkbox-lbl { display: flex; align-items: flex-start; gap: 10px; font-size: 0.9rem; cursor: pointer; color: #fff; }
    .toast-msg { padding: 10px; border-radius: var(--r-sm); font-size: 0.88rem; font-weight: 600; margin-bottom: 12px; }
    .toast-success { background: var(--dew); color: var(--forest); border: 1px solid var(--mint); }
    .toast-error { background: var(--red-l); color: var(--red); border: 1px solid #fca5a5; }
    
    .preview-court { margin-bottom: 12px; border: 1px solid var(--fog); border-radius: var(--r-sm); overflow: hidden; }
    .preview-court-head { background: var(--cream); padding: 6px 10px; font-size: 12px; font-weight: 600; display: flex; justify-content: space-between; }
    .preview-court-body { padding: 8px; background: var(--ivory); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const INIT_PLAYERS = [
      { id: 1, name: 'James Mitchell', email: 'j.mitchell@gmail.com', phone: '(847) 555-0101', active: true },
      { id: 2, name: 'Sarah Chen', email: 's.chen@gmail.com', phone: '(847) 555-0102', active: true },
      { id: 3, name: 'Marcus Webb', email: 'm.webb@gmail.com', phone: '(847) 555-0103', active: true },
      { id: 4, name: 'Priya Patel', email: 'p.patel@gmail.com', phone: '(847) 555-0104', active: true },
      { id: 5, name: 'Tom Garrison', email: 't.garrison@gmail.com', phone: '(847) 555-0105', active: true },
      { id: 6, name: 'Elena Vasquez', email: 'e.vasquez@gmail.com', phone: '(847) 555-0106', active: true },
      { id: 7, name: 'David Kim', email: 'd.kim@gmail.com', phone: '(847) 555-0107', active: true },
      { id: 8, name: 'Rachel Torres', email: 'r.torres@gmail.com', phone: '(847) 555-0108', active: true },
      { id: 9, name: 'Chris Novak', email: 'c.novak@gmail.com', phone: '(847) 555-0109', active: true },
      { id: 10, name: 'Aisha Johnson', email: 'a.johnson@gmail.com', phone: '(847) 555-0110', active: true },
      { id: 11, name: 'Luke Brennan', email: 'l.brennan@gmail.com', phone: '(847) 555-0111', active: true },
      { id: 12, name: 'Nina Okafor', email: 'n.okafor@gmail.com', phone: '(847) 555-0112', active: true }
    ];

    const MOCK_ACCOUNTS = [
      ...INIT_PLAYERS.map(p => ({ ...p, role: 'player' })),
      { id: 0, name: 'League Admin', email: 'admin@glenview.tennis', phone: '(847) 555-0000', active: true, role: 'admin' }
    ];

    const DEFAULT_STANDINGS = INIT_PLAYERS.map((p, idx) => ({
      id: p.id,
      wins: 24 - idx > 0 ? 24 - idx : 6,
      losses: 6 + idx,
    }));

    const DEFAULT_SCHEDULE = [
      {
        label: 'Week 8 — Jun 2, 2026',
        courts: [
          { num: 1, time: '7:00 PM', players: [1, 2, 3, 4] },
          { num: 2, time: '7:00 PM', players: [5, 6, 7, 8] },
          { num: 3, time: '8:30 PM', players: [9, 10, 11, 12] }
        ]
      }
    ];

    const DEFAULT_LAST_SEASON = INIT_PLAYERS.map((p, idx) => ({
      id: p.id,
      rank: idx + 1,
      wins: 45 - idx * 2,
      losses: 20 + idx * 2
    }));

    const AVC = ['#2d6a4f', '#1b4332', '#4a7c59', '#52796f', '#354f52', '#2c3e50', '#8b5e3c', '#5c4033', '#3d405b', '#6b4226', '#1a5276', '#6d4c41'];
    function pColor(id) { return AVC[(id - 1) % AVC.length] || '#2d6a4f'; }
    function initials(name) { return name ? name.split(' ').map(n => n[0]).join('') : '?'; }
    function pObj(id, list) { return list.find(x => x.id === id) || { name: 'Unknown', id: 0 }; }
    function pFirst(id, list) { return pObj(id, list).name.split(' ')[0]; }

    function Avatar({ pid, size = 34, players }) {
      return <div className="avatar" style={{ width: size, height: size, background: pColor(pid), fontSize: size * .35 }}>{initials(pObj(pid, players).name)}</div>;
    }

    function autoAssignCourts(activePlayers, lastSeason, standings) {
      const scored = activePlayers.map(p => {
        const ls = lastSeason.find(x => x.id === p.id);
        const cs = standings.find(x => x.id === p.id);
        const n = activePlayers.length;
        let score = 0.5;
        const hasLS = ls && ls.rank > 0;
        const hasCS = cs && (cs.wins + cs.losses) > 0;
        if (hasLS && hasCS) {
          const lsS = (n + 1 - ls.rank) / n;
          const csS = cs.wins / (cs.wins + cs.losses);
          score = lsS * 0.35 + csS * 0.65;
        } else if (hasLS) {
          score = (n + 1 - ls.rank) / n;
        } else if (hasCS) {
          score = cs.wins / (cs.wins + cs.losses);
        }
        return { id: p.id, score };
      });
      scored.sort((a, b) => b.score - a.score);
      const groups = [scored.slice(0, 4), scored.slice(4, 8), scored.slice(8, 12)];
      return groups.map((g, i) => {
        if (g.length < 4) return { num: i + 1, players: g.map(x => x.id), time: '7:00 PM' };
        return {
          num: i + 1,
          players: [g[0].id, g[3].id, g[1].id, g[2].id],
          time: i === 2 ? '8:30 PM' : '7:00 PM'
        };
      });
    }

    function MiniTennisCourt({ p0, p1, p2, p3, user, players }) {
      return (
        <div className="court-field clearfix">
          <div className="court-net"></div>
          <div className="court-team left">
            <div className={`court-p ${[p0, p1].includes(user.id) ? 'me' : ''}`}>
              <div className="court-p-av" style={{ background: pColor(p0) }}>{initials(pObj(p0, players).name)}</div>
              <div className="court-p-name">{pFirst(p0, players)}</div>
            </div>
            <div className={`court-p ${[p0, p1].includes(user.id) ? 'me' : ''}`}>
              <div className="court-p-av" style={{ background: pColor(p1) }}>{initials(pObj(p1, players).name)}</div>
              <div className="court-p-name">{pFirst(p1, players)}</div>
            </div>
          </div>
          <div className="court-team right">
            <div className={`court-p ${[p2, p3].includes(user.id) ? 'me' : ''}`}>
              <div className="court-p-av" style={{ background: pColor(p2) }}>{initials(pObj(p2, players).name)}</div>
              <div className="court-p-name">{pFirst(p2, players)}</div>
            </div>
            <div className={`court-p ${[p2, p3].includes(user.id) ? 'me' : ''}`}>
              <div className="court-p-av" style={{ background: pColor(p3) }}>{initials(pObj(p3, players).name)}</div>
              <div className="court-p-name">{pFirst(p3, players)}</div>
            </div>
          </div>
        </div>
      );
    }

    function GlenviewTennisApp() {
      const [user, setUser] = useState(null);
      const [currentTab, setCurrentTab] = useState('dashboard');
      
      const [players, setPlayers] = useState(() => {
        const local = localStorage.getItem('gtl_players');
        return local ? JSON.parse(local) : INIT_PLAYERS;
      });
      const [standings, setStandings] = useState(() => {
        const local = localStorage.getItem('gtl_standings_v2');
        return local ? JSON.parse(local) : DEFAULT_STANDINGS;
      });
      
      // Fixed gtl_schedule_v2 namespace to dodge legacy layout crashes from local cache
      const [schedule, setSchedule] = useState(() => {
        const local = localStorage.getItem('gtl_schedule_v2');
        return local ? JSON.parse(local) : DEFAULT_SCHEDULE;
      });
      const [lastSeason, setLastSeason] = useState(() => {
        const local = localStorage.getItem('gtl_lastseason');
        return local ? JSON.parse(local) : DEFAULT_LAST_SEASON;
      });

      const [subChecked, setSubChecked] = useState(false);
      const [isSendingMsg, setIsSendingMsg] = useState(false);
      const [emailStatus, setEmailStatus] = useState({ type: null, text: '' });

      const [recordPlayerId, setRecordPlayerId] = useState('');
      const [gamesWon, setGamesWon] = useState('');
      const [gamesLost, setGamesLost] = useState('');

      const [showLastSeasonModal, setShowLastSeasonModal] = useState(false);
      const [showPreviewModal, setShowPreviewModal] = useState(false);
      const [showPresetModal, setShowPresetModal] = useState(false);
      const [selectedPresetCourt, setSelectedPresetCourt] = useState(null);
      const [proposedCourts, setProposedCourts] = useState([]);

      useEffect(() => { localStorage.setItem('gtl_players', JSON.stringify(players)); }, [players]);
      useEffect(() => { localStorage.setItem('gtl_standings_v2', JSON.stringify(standings)); }, [standings]);
      useEffect(() => { localStorage.setItem('gtl_schedule_v2', JSON.stringify(schedule)); }, [schedule]);
      useEffect(() => { localStorage.setItem('gtl_lastseason', JSON.stringify(lastSeason)); }, [lastSeason]);

      useEffect(() => { emailjs.init("YOUR_PUBLIC_KEY_HERE"); }, []);

      if (!user) return <LoginPage onLogin={(loggedUser) => setUser(loggedUser)} />;

      const isAdmin = user.role === 'admin';
      const currentWeekData = schedule[0] || { label: 'No Active Week Set', courts: [] };
      const userCourtMatch = currentWeekData.courts ? currentWeekData.courts.find(c => c.players && c.players.includes(user.id)) : null;

      const getWinRate = (row) => {
        const total = row.wins + row.losses;
        return total > 0 ? (row.wins / total) : 0;
      };
      const sortedStandings = [...standings].sort((a, b) => {
        const rateA = getWinRate(a);
        const rateB = getWinRate(b);
        if (rateB !== rateA) return rateB - rateA;
        return b.wins - a.wins;
      });

      const handleRecordMatchScore = (e) => {
        e.preventDefault();
        if (!recordPlayerId || gamesWon === '' || gamesLost === '') {
          alert("Please pick a player and fill both games won and lost fields.");
          return;
        }

        const nextStandings = standings.map(row => {
          if (row.id === parseInt(recordPlayerId)) {
            return {
              ...row,
              wins: row.wins + parseInt(gamesWon),
              losses: row.losses + parseInt(gamesLost)
            };
          }
          return row;
        });

        setStandings(nextStandings);
        setRecordPlayerId('');
        setGamesWon('');
        setGamesLost('');
        alert("Timed round-robin tallies successfully submitted to the tracking scoreboard!");
      };

      const handleBroadcastSubRequest = async () => {
        if (!userCourtMatch) return;
        setIsSendingMsg(true);
        setEmailStatus({ type: null, text: '' });

        const busyIds = new Set();
        if (currentWeekData.courts) {
          currentWeekData.courts.forEach(c => {
            if (c.time === userCourtMatch.time && c.players) {
              c.players.forEach(pid => busyIds.add(pid));
            }
          });
        }

        const activeAvailableSubs = players.filter(p => p.active && !busyIds.has(p.id) && p.id !== user.id);
        const aggregatedEmails = activeAvailableSubs.map(p => p.email).filter(Boolean).join(',');

        if (!aggregatedEmails) {
          alert("No off-duty players are available in this schedule bracket.");
          setIsSendingMsg(false);
          return;
        }

        try {
          await emailjs.send("YOUR_SERVICE_ID_HERE", "YOUR_TEMPLATE_ID_HERE", {
            player_name: user.name,
            court_num: userCourtMatch.num,
            match_time: userCourtMatch.time,
            sub_emails: aggregatedEmails,
            reply_to: user.email
          });
          setEmailStatus({ type: 'success', text: '✓ Substitute alert broadcast successfully delivered to available list.' });
          setSubChecked(false);

    function LastSeasonModal({ players, lastSeason, onSave, onClose }) {
      const active = players.filter(p => p.active);
      const [ranks, setRanks] = useState(() => {
        const m = {};
        active.forEach(p => {
          const ex = lastSeason.find(x => x.id === p.id);
          m[p.id] = { rank: ex ? ex.rank : '', wins: ex ? ex.wins : '', losses: ex ? ex.losses : '' };
        });
        return m;
      });

      const updateField = (id, field, val) => {
        setRanks(prev => ({ ...prev, [id]: { ...prev[id], [field]: val } }));
      };

      return (
        <div className="modal-bg" onClick={e => e.target === e.currentTarget && onClose()}>

            <h3 style={{ marginBottom: '10px', color: 'var(--forest)' }}>📥 Import Last Season Ranks & Tallies</h3>

                    <td>{p.name}</td>

                    <td><input type="number" className="form-input" style={{ width: '60px', padding: '4px' }} value={ranks[p.id]?.wins || ''} onChange={e => updateField(p.id, 'wins', e.target.value)} /></td>
                    <td><input type="number" className="form-input" style={{ width: '60px', padding: '4px' }} value={ranks[p.id]?.losses || ''} onChange={e => updateField(p.id, 'losses', e.target.value)} /></td>

        <div className="modal-bg" onClick={e => e.target === e.currentTarget && onClose()}>
          <div className="modal">
            <h3 style={{ marginBottom: '15px', color: 'var(--forest)' }}>✏️ Override Court Assignment Lineup {court.num}</h3>
            <div className="form-group">
              <label className="form-label">Time Window Slot</label>
              <select className="form-select" value={time} onChange={e => setTime(e.target.value)}>
                <option value="7:00 PM">7:00 PM</option>
                <option value="8:30 PM">8:30 PM</option>
              </select>
            </div>
            {slots.map((pid, idx) => (
              <div className="form-group" key={idx}>
                <label className="form-label">Court Position Player {idx + 1}</label>
                <select className="form-select" value={pid} onChange={e => changeSlot(idx, e.target.value)}>
                  {players.filter(p => p.active).map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                </select>
              </div>
            ))}
            <div style={{ display: 'flex', gap: 10, marginTop: '1.5rem' }}>
              <button className="btn btn-primary" style={{ flex: 1 }} onClick={() => {
                if (new Set(slots).size < 4) {
                  alert("Lineup assignment error. Duplicated roster entities selected.");
                  return;
                }
                onSave({ ...court, players: slots, time });
              }}>Save Parameters</button>
              <button className="btn btn-outline" onClick={onClose}>Cancel Override</button>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<GlenviewTennisApp />);
  </script>
</body>
</html>
