<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glenview Tennis League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
/* ── [STYLES REMAIN THE SAME AS PREVIOUS VERSION] ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--c0:#071a0f; --c1:#0d2b1c; --c2:#1b4332; --c3:#2d6a4f; --c4:#52b788; --c5:#b7e4c7; --c6:#d8f3dc; --ivory:#f7f5ef; --cream:#ede9e0; --white:#ffffff; --ink:#111614; --slate:#3d4f45; --mist:#7a8f82; --fog:#dce6de; --g0:#7a5b10; --g1:#b8892a; --g2:#d4a843; --g3:#f5e6c0; --g4:#fdf8ed; --red:#bf3228; --blue:#1a56a0; --r:10px; --r-sm:6px; --r-lg:16px; --r-xl:22px; --sd:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.05); --sd-sm:0 1px 3px rgba(0,0,0,.07); --sd-lg:0 8px 32px rgba(0,0,0,.12);}
body{font-family:'DM Sans',sans-serif;background:var(--ivory);color:var(--ink);min-height:100vh;font-size:15px}
h1,h2,h3{font-family:'DM Serif Display',serif}
button{cursor:pointer}
.nav{background:var(--c0);height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 1.75rem;position:sticky;top:0;z-index:200}
.nav-logo{display:flex;align-items:center;gap:11px;cursor:pointer;color:#fff}
.nav-ball{width:34px;height:34px;background:var(--g2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px}
.nav-links{display:flex;gap:2px}
.nav-btn{color:rgba(255,255,255,.55);padding:7px 13px;border-radius:var(--r-sm);font-size:13px;background:none;border:none;transition:all .15s}
.nav-btn.on{color:#fff;background:rgba(255,255,255,.13)}
.page{max-width:1140px;margin:0 auto;padding:2.5rem 1.75rem}
.card{background:var(--white);border-radius:var(--r);box-shadow:var(--sd);border:1px solid var(--fog);overflow:hidden;margin-bottom:1rem}
.card-hd{padding:.85rem 1.25rem;border-bottom:1px solid var(--fog);background:var(--cream);font-weight:600}
.card-bd{padding:1.25rem}
.btn{padding:9px 18px;border-radius:var(--r-sm);font-weight:500;border:none;background:var(--c1);color:#fff}
.btn-o{background:#fff;border:1px solid var(--fog);color:var(--ink)}
.btn-xs{padding:3px 9px;font-size:11px}
.fi{width:100%;padding:9px;border:1px solid var(--fog);border-radius:var(--r-sm)}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:11px}
.pc{background:var(--white);border-radius:var(--r);border:1px solid var(--fog);padding:.95rem;display:flex;align-items:center;gap:11px}
.pc-info{flex:1;min-width:0}
.pc-name{font-weight:600;font-size:.88rem}
.pc-meta{font-size:11.5px;color:var(--mist)}
.admin-bar{background:var(--g4);padding:7px 1.75rem;font-size:12.5px;color:var(--g0);display:flex;justify-content:space-between}
</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="env,react">
  const { useState } = React;
  const SEED_PLAYERS = [{id:1,name:'James Mitchell',email:'j.mitchell@ex.com',phone:'(847) 555-0101',active:true}];
  const SEED_LEAGUE = {id:'default_1',name:'Glenview Summer 2026',players:SEED_PLAYERS,standings:[],lastSeason:[],schedule:[]};

  function App() {
    const [appData, setAppData] = useState({ activeLeagueId: 'default_1', leagues: [SEED_LEAGUE] });
    const [user, setUser] = useState({id:0, name:'Admin', role:'admin'}); // Defaulted to admin for testing
    const [activeTab, setActiveTab] = useState('players');
    const currentLeague = appData.leagues.find(l => l.id === appData.activeLeagueId);

    function updateLeague(updatedFields) {
      setAppData(prev => ({...prev, leagues: prev.leagues.map(l => l.id === prev.activeLeagueId ? {...l, ...updatedFields} : l)}));
    }

    return (
      <div>
        <div className="nav">
          <div className="nav-logo" onClick={() => setActiveTab('players')}>🎾 Glenview League</div>
          <div className="nav-links">
            <button className={`nav-btn ${activeTab==='players'?'on':''}`} onClick={()=>setActiveTab('players')}>Roster</button>
          </div>
        </div>

        {activeTab === 'players' && (
          <div className="page">
            <h1 className="page-title">League Roster</h1>
            
            {user.role === 'admin' && (
              <div className="card">
                <div className="card-hd">Add New Player</div>
                <div className="card-bd" style={{display: 'flex', gap: '10px'}}>
                  <input className="fi" id="new-name" placeholder="Full Name" />
                  <input className="fi" id="new-phone" placeholder="Phone" />
                  <button className="btn" onClick={() => {
                    const name = document.getElementById('new-name').value;
                    const phone = document.getElementById('new-phone').value;
                    if(name) {
                      updateLeague({ players: [...currentLeague.players, {id: Date.now(), name, phone, active: true}] });
                      document.getElementById('new-name').value = '';
                    }
                  }}>Add</button>
                </div>
              </div>
            )}

            <div className="pg">
              {currentLeague.players.map(p => (
                <div key={p.id} className="pc">
                  <div className="pc-info">
                    <div className="pc-name">{p.name}</div>
                    <div className="pc-meta">📱 {p.phone}</div>
                  </div>
                  {user.role === 'admin' && (
                    <button className="btn btn-o btn-xs" style={{color:'var(--red)'}} onClick={() => {
                      if(confirm('Delete player?')) updateLeague({ players: currentLeague.players.filter(pl => pl.id !== p.id) });
                    }}>✕</button>
                  )}
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    );
  }
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
  </script>
</body>
</html>
